name: Temporary format detail branch
on:
  push:
    branches: [feat/detail-by-id-protected-02f05c11-20261027]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format detail branch')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detail-by-id-protected-02f05c11-20261027
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Format branch changes and self-remove temporary workflow
        run: |
          npx prettier --write -- src/domain/classes/application/repositories/classes-repository.ts src/domain/classes/application/use-cases/get-class.ts src/domain/students/application/repositories/students-repository.ts src/domain/students/application/use-cases/get-student.ts src/domain/teachers/application/repositories/teachers-repository.ts src/domain/teachers/application/use-cases/get-teacher.ts src/infra/database/prisma/detail-read-scope.spec.ts src/infra/database/prisma/repositories/prisma-classes-repository.ts src/infra/database/prisma/repositories/prisma-students-repository.ts src/infra/database/prisma/repositories/prisma-teachers-repository.ts src/infra/http/controllers/classes.controller.ts src/infra/http/controllers/students.controller.ts src/infra/http/controllers/teachers.controller.ts src/infra/http/use-case.providers.ts test/entity-details.e2e-spec.ts test/repositories/in-memory-classes-repository.ts test/repositories/in-memory-students-repository.ts test/repositories/in-memory-teachers-repository.ts src/domain/students/enterprise/entities/student.ts src/infra/database/prisma/mappers/prisma-student-mapper.ts src/infra/http/presenters/student.presenter.ts
          rm .github/workflows/tmp-format-detail-02f05c11.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: format detail branch' 
          git push
