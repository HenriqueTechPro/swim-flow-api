name: Temporary 02F-06B3D formatting preview

on:
  pull_request:
    paths:
      - '.github/workflows/private-commit-prettier-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exact formatter diff without changing GitHub source
        run: |
          npx prettier --write src/domain/uploads/application/use-cases/commit-private-blob-image.ts src/infra/http/services/private-image-access.service.spec.ts
          git --no-pager diff -- src/domain/uploads/application/use-cases/commit-private-blob-image.ts src/infra/http/services/private-image-access.service.spec.ts
