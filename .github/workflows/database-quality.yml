name: PostgreSQL baseline quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prisma-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: swimflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d swimflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/swimflow?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/swimflow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma models
        run: npm run prisma:validate
      - name: Generate client
        run: npm run prisma:generate
      - name: Ensure committed migration matches Prisma schema and manual SQL
        run: node scripts/create-neon-baseline.cjs --check
      - name: Ensure initial migration stays immutable after future migrations
        run: |
          mkdir prisma/migrations/20270101000000_ci_incremental
          trap 'rmdir prisma/migrations/20270101000000_ci_incremental' EXIT
          node scripts/create-neon-baseline.cjs --check
      - name: Deploy versioned migration to disposable PostgreSQL
        run: npm run prisma:migrate:deploy
      - name: Verify concrete SQL constraints and nullability
        run: node node_modules/prisma/build/index.js db execute --file test/sql/neon-baseline-verification.sql --schema prisma/schema.prisma
      - name: Verify staged local identity schema and security constraints
        run: node node_modules/prisma/build/index.js db execute --file test/sql/local-auth-foundation-verification.sql --schema prisma/schema.prisma
      - name: Private media metadata constraints and uploader audit (disposable PostgreSQL)
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/verify-private-media-objects.cjs
      - name: Private media lifecycle race and cleanup transitions (disposable PostgreSQL)
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/verify-private-media-lifecycle.cjs
      - name: Server-verified Vercel Blob records (disposable PostgreSQL only)
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/verify-private-blob-verified.cjs
      - name: Active Blob photo binding integrity and CAS (disposable PostgreSQL)
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/verify-private-blob-binding.cjs
      - name: Atomic private photo commit and rollback (disposable PostgreSQL)
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node -r ts-node/register/transpile-only -r tsconfig-paths/register scripts/verify-private-blob-commit.cjs
      - name: Legacy photo write guard and private commit race (disposable PostgreSQL)
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node -r ts-node/register/transpile-only -r tsconfig-paths/register scripts/verify-legacy-photo-guard.cjs
      - name: Atomic Blob cleanup claim and FK race (disposable PostgreSQL)
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node -r ts-node/register/transpile-only -r tsconfig-paths/register scripts/verify-private-blob-claim.cjs
      - name: Admin bootstrap concurrency on disposable PostgreSQL
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/bootstrap-first-admin.integration.cjs
      - name: Verify invitation and password-reset token security on disposable PostgreSQL
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/verify-local-auth-actions.cjs
      - name: Verify administrator invitations and token reissue on disposable PostgreSQL
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/verify-local-admin-invitations.cjs
      - name: Real Prisma repository and PostgreSQL integration scenarios
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: node scripts/verify-postgres-flows.cjs
      - name: Verify concurrent writes and transaction rollback on PostgreSQL
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: node scripts/verify-postgres-concurrency.cjs
      - name: Atomic refresh token, JWT and logout security on disposable PostgreSQL
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
        run: node scripts/verify-auth-session-rotation.cjs
      - name: HTTP end-to-end with real NestJS repositories and PostgreSQL
        env:
          SWIMFLOW_DISPOSABLE_DB: 'yes'
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          JWT_ACCESS_SECRET: ci-only-secret-must-be-at-least-32-characters
        run: npx jest --config ./test/jest-postgres-http.json --runInBand
      - name: Check migration status
        run: node node_modules/prisma/build/index.js migrate status --schema prisma/schema.prisma
      - name: Compare deployed Prisma-managed schema with current schema
        run: node node_modules/prisma/build/index.js migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Verify deploy is idempotent
        run: npm run prisma:migrate:deploy
