name: Temporary private-image Prettier preview

on:
  pull_request:
    paths:
      - '.github/workflows/private-image-prettier-preview.yml'
      - 'src/domain/uploads/application/use-cases/list-active-private-blob-references.spec.ts'
      - 'src/infra/http/services/private-image-access.service.spec.ts'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Show exact Prettier output as diff without pushing changes
        run: |
          npx prettier --write src/domain/uploads/application/use-cases/list-active-private-blob-references.spec.ts src/infra/http/services/private-image-access.service.spec.ts
          git --no-pager diff -- src/domain/uploads/application/use-cases/list-active-private-blob-references.spec.ts src/infra/http/services/private-image-access.service.spec.ts
