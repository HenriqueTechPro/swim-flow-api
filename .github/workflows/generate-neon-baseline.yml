name: Generate initial Neon SQL (feature branch only)

on:
  push:
    branches:
      - chore/neon-baseline-20261020

# Constrained to one feature branch. This workflow is NOT a deploy.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/swimflow
      DIRECT_URL: postgresql://ci:ci@localhost:5432/swimflow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate schema
        run: npm run prisma:validate
      - name: Generate deterministic baseline
        run: node scripts/create-neon-baseline.cjs
      - name: Commit generated SQL to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261020000000_init_neon/migration.sql
          if git diff --cached --quiet; then
            echo "Baseline already generated"
          else
            git commit -m "chore(db): version initial Neon PostgreSQL migration"
            git push origin HEAD:refs/heads/chore/neon-baseline-20261020
          fi
