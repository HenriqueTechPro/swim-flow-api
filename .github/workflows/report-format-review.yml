name: Temporary report formatting review
on:
  pull_request:
    paths:
      - 'src/infra/http/services/student-progress-report*'
      - '.github/workflows/report-format-review.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Show only proposed formatting diff, never push
        run: |
          node node_modules/prettier/bin/prettier.cjs --write -- src/infra/http/services/student-progress-report.service.ts src/infra/http/services/student-progress-report.observation.spec.ts
          git diff -- src/infra/http/services/student-progress-report.service.ts src/infra/http/services/student-progress-report.observation.spec.ts
