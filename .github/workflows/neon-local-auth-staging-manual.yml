# Manual, reviewed and opt-in ONLY. No push, pull_request or schedule trigger.
# Requires the "swimflow-neon-staging" environment with required reviewers
# and environment secrets SWIMFLOW_STAGING_DATABASE_URL (pooled) and
# SWIMFLOW_STAGING_DIRECT_URL (direct). Neither value may go into Git.
name: Apply Neon staging local auth migration (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY_SWIM_FLOW_LOCAL_AUTH_STAGING to authorize schema migration on Neon STAGING'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swimflow-neon-staging-local-auth-schema
  cancel-in-progress: false

jobs:
  prisma-staging-local-auth:
    name: Apply reviewed Prisma migrations to Neon staging
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'HenriqueTechPro/swim-flow-api' &&
          inputs.confirmation == 'APPLY_SWIM_FLOW_LOCAL_AUTH_STAGING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: swimflow-neon-staging
    env:
      # Non-secret, fixed staging target. Credentials are step-scoped below:
      # never expose them to npm ci, package lifecycle scripts or codegen.
      NEON_PROJECT_ID: raspy-breeze-33258358
      NEON_BRANCH_ID: br-gentle-wildflower-b7qrnd74
      SWIMFLOW_LOCAL_AUTH_STAGING_APPROVAL: APPLY_SWIM_FLOW_LOCAL_AUTH_STAGING
    steps:
      - name: Check repository, ref, and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "HenriqueTechPro/swim-flow-api"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "APPLY_SWIM_FLOW_LOCAL_AUTH_STAGING"
      - name: Checkout immutable main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate schema and generate Prisma 6 client
        # Prisma requires URLs to parse schema.prisma, but no network access
        # is performed by validate/generate. Real Neon secrets stay absent.
        env:
          DATABASE_URL: postgresql://offline:offline@localhost:5432/swimflow?schema=public
          DIRECT_URL: postgresql://offline:offline@localhost:5432/swimflow?schema=public
        run: |
          npm run prisma:validate
          npm run prisma:generate
      - name: Verify reviewed migrations without database access
        run: npm run neon:local-auth:staging -- --check
      - name: Validate strict Neon TLS and pooled/direct URLs
        env:
          DATABASE_URL: ${{ secrets.SWIMFLOW_STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SWIMFLOW_STAGING_DIRECT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$DIRECT_URL"
          npm run neon:preflight
      - name: Apply only the reviewed incremental migration using Prisma CLI
        env:
          DATABASE_URL: ${{ secrets.SWIMFLOW_STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SWIMFLOW_STAGING_DIRECT_URL }}
        run: npm run neon:local-auth:staging -- --apply
