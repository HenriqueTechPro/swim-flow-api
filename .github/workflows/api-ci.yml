name: API quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/swimflow
      DIRECT_URL: postgresql://ci:ci@localhost:5432/swimflow
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      JWT_ACCESS_SECRET: ci-only-secret-must-be-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run build
      - name: Type-aware lint (read-only)
        run: npm run lint:check
      - run: npm run test:unit
      - run: npm run test:e2e
