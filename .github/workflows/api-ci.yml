name: API quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/swimflow
      DIRECT_URL: postgresql://ci:ci@localhost:5432/swimflow
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      JWT_ACCESS_SECRET: ci-only-secret-must-be-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed to compare base/head files from a PR.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Temporary read-only formatting preview
        run: |
          node <<'NODE'
          const fs=require('node:fs');const prettier=require('prettier');
          (async()=>{for(const path of ["src/domain/students/application/repositories/students-repository.ts","src/domain/students/application/use-cases/list-upcoming-birthdays.spec.ts","src/infra/database/prisma/repositories/prisma-students-birthdays.spec.ts","src/infra/http/use-case.providers.ts","test/repositories/in-memory-students-repository.ts","test/students.e2e-spec.ts"]){const source=fs.readFileSync(path,'utf8');const cfg=await prettier.resolveConfig(path);const content=await prettier.format(source,{...cfg,filepath:path});const base64=Buffer.from(content).toString('base64');console.log('FMT_BEGIN '+path+' '+base64.length);for(let i=0;i<base64.length;i+=1500)console.log('FMT_CHUNK '+path+' '+base64.slice(i,i+1500));console.log('FMT_END '+path);}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - name: Verify consecutive builds regenerate production artifacts
        run: |
          npm run build
          npm run build
      - name: Verify Render production entrypoint and immutable Prisma SQL bytes
        run: node --test scripts/render-entrypoint.test.cjs
      # Existing Prettier-only debt is tracked separately, to avoid mixing
      # 1,000+ formatting diffs into a security-sensitive refactor.
      - name: Type-aware semantic lint (without legacy formatting errors)
        run: |
          npm run lint:check -- --rule 'prettier/prettier: off'
      - name: Validate Render staging Blueprint without deployment
        run: npm run render:blueprint:test
      - name: Test Neon preflight without live credentials
        run: npm run neon:preflight:test
      - name: Test read-only Neon inspection with synthetic database responses
        run: npm run neon:inspect:test
      - name: Test guarded Prisma staging migration without real Neon credentials
        run: npm run neon:staging:migrate:test
      - name: Verify incremental local auth staging runner without Neon credentials
        run: npm run neon:local-auth:staging:test
      - name: Audit manual Neon staging workflow safety boundaries
        run: node --test scripts/neon-local-auth-dispatch.test.cjs
      - name: Test incremental formatting file selection
        run: npm run format:changed:test
      - name: Enforce Prettier only on TypeScript changed by this PR
        if: github.event_name == 'pull_request'
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORMAT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run format:changed -- "$FORMAT_BASE_SHA" "$FORMAT_HEAD_SHA" --check
      - name: Guard private Blob manual smoke environment (offline only)
        run: npm run blob:smoke:guard:test
      - name: Guarded first admin bootstrap tests
        run: npm run bootstrap:first-admin:test
      - name: Resend isolated delivery tests (network mocked, no account access)
        run: npm run resend:smoke:test
      - run: npm run test:unit
      - run: npm run test:e2e
