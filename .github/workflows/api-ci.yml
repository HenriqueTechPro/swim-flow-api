name: API quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/swimflow
      DIRECT_URL: postgresql://ci:ci@localhost:5432/swimflow
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      JWT_ACCESS_SECRET: ci-only-secret-must-be-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed to compare base/head files from a PR.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run build
      # Existing Prettier-only debt is tracked separately, to avoid mixing
      # 1,000+ formatting diffs into a security-sensitive refactor.
      - name: Type-aware semantic lint (without legacy formatting errors)
        run: |
          npm run lint:check -- --rule 'prettier/prettier: off'
      - name: Validate Render staging Blueprint without deployment
        run: npm run render:blueprint:test
      - name: Test Neon preflight without live credentials
        run: npm run neon:preflight:test
      - name: Test read-only Neon inspection with synthetic database responses
        run: npm run neon:inspect:test
      - name: Test guarded Prisma staging migration without real Neon credentials
        run: npm run neon:staging:migrate:test
      - name: Verify incremental local auth staging runner without Neon credentials
        run: npm run neon:local-auth:staging:test
      - name: Audit manual Neon staging workflow safety boundaries
        run: node --test scripts/neon-local-auth-dispatch.test.cjs
      - name: Audit one-time staging administrator workflow and stdin isolation
        run: node --test scripts/bootstrap-first-admin-github.test.cjs
      - name: Test incremental formatting file selection
        run: npm run format:changed:test
      - name: Enforce Prettier only on TypeScript changed by this PR
        if: github.event_name == 'pull_request'
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORMAT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run format:changed -- "$FORMAT_BASE_SHA" "$FORMAT_HEAD_SHA" --check
      - name: Guarded first admin bootstrap tests
        run: npm run bootstrap:first-admin:test
      - run: npm run test:unit
      - run: npm run test:e2e
