name: Temporary 02E16B2 dependency and format bootstrap
on:
  push:
    branches:
      - feat/private-media-s3-adapter-02e16b2-20261024
    paths:
      - .github/workflows/temp-media-dependency-bootstrap.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'HenriqueTechPro/swim-flow-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm generated dependencies and lockfile
        run: npm install --save --save-exact @aws-sdk/client-s3@3 @aws-sdk/s3-request-presigner@3
      - name: Locked clean install
        run: npm ci
      - name: Format new TS sources only
        run: >-
          ./node_modules/.bin/prettier --write
          src/infra/storage/s3-private-media-storage.repository.ts
          src/infra/storage/s3-private-media-storage.repository.spec.ts
      - name: Validate TypeScript build
        run: npm run build
      - name: Run new offline S3/R2 tests
        run: ./node_modules/.bin/jest src/infra/storage/s3-private-media-storage.repository.spec.ts --runInBand
      - name: Commit generated lockfile, dependencies and formatting to PR branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json src/infra/storage/s3-private-media-storage.repository.ts src/infra/storage/s3-private-media-storage.repository.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(media): npm-lock AWS SDK and format S3 adapter"
            git push origin HEAD:feat/private-media-s3-adapter-02e16b2-20261024
          fi
