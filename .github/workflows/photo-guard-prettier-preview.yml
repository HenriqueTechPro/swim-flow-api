name: Temporary private photo guard Prettier preview

on:
  pull_request:
    paths:
      - '.github/workflows/photo-guard-prettier-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write src/infra/database/prisma/repositories/legacy-photo-write-guard.spec.ts src/infra/database/prisma/repositories/legacy-photo-write-guard.ts src/infra/database/prisma/repositories/prisma-auth-profiles-repository.ts
          git --no-pager diff -- src/infra/database/prisma/repositories/legacy-photo-write-guard.spec.ts src/infra/database/prisma/repositories/legacy-photo-write-guard.ts src/infra/database/prisma/repositories/prisma-auth-profiles-repository.ts
