name: Render staging — anonymous readiness check (READ ONLY)

# Manual only: no deploy, no credentials, no DB mutations or write requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-render-staging:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'HenriqueTechPro/swim-flow-api' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned Render hostname without network
        run: node scripts/render-staging-readiness.cjs --check
      - name: Verify dedicated Render staging process and Neon connectivity (GET only)
        run: node scripts/render-staging-readiness.cjs --probe
