# Swim Flow API — STAGING only (Render + Neon, frontend remains Vercel).
# This Blueprint creates ONE free Node web service, NOT a Render database.
# Supply secrets through the Render Dashboard. Never commit their values.
services:
  - type: web
    name: swim-flow-api-staging
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SWAGGER_ENABLED
        value: "false"
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: AUTH_SECURE_COOKIES
        value: "true"
      - key: AUTH_COOKIE_PATH
        value: /api/auth
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      # Private media stays OFF until isolated Blob store and E2E review.
      - key: SWIMFLOW_PRIVATE_BLOB_ENABLED
        value: "false"
      - key: SWIMFLOW_PRIVATE_MEDIA_S3_ENABLED
        value: "false"
      - key: SWIMFLOW_R2_STORAGE_ENABLED
        value: "false"
      # Enabled manually only after reviewed first-admin bootstrap and auth tests.
      - key: SWIMFLOW_LOCAL_PASSWORD_LOGIN_ENABLED
        value: "false"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: API_CORS_ORIGIN
        sync: false
      # Legacy Supabase Auth and Storage are not enabled on Neon-only staging.
      # Those adapters return HTTP 503 if their credentials are absent.
